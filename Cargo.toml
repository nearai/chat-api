[workspace]
members = ["crates/*"]
resolver = "2"
exclude = ["vendor/dstack-sdk"]

[workspace.package]
edition = "2021"
version = "0.0.0"
authors = ["support@near.ai"]
license = "MIT"
description = "NEAR AI Chat API"

[profile.dev]
debug = true

# Client-only dstack-sdk patch removes the unused, vulnerable Alloy dependency.
# See vendor/dstack-sdk/README.md for provenance and removal conditions.
[patch.crates-io]
dstack-sdk = { path = "vendor/dstack-sdk" }
