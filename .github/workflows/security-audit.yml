name: Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *" # Daily at 00:00 UTC

# Cancel superseded PR scans without cancelling scheduled or main-branch scans.
concurrency:
  group: security-audit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2
      - name: Check lockfile vulnerabilities and warnings
        run: cargo audit --deny warnings

  deny:
    name: cargo deny (advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # Use the prebuilt binary to avoid Docker Hub availability/rate limits.
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, dependency bans, and sources
        run: cargo deny --locked --all-features check advisories bans sources
