name: Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Avoid the top-of-hour scheduling peak on GitHub Actions.
    - cron: "17 0 * * *" # Daily at 00:17 UTC

# Cancel superseded PR scans without cancelling scheduled or main-branch scans.
concurrency:
  group: security-audit-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit@0.22.2
      - name: Check lockfile vulnerabilities and warnings
        run: cargo audit --deny warnings

  deny:
    name: cargo deny (advisories + bans + sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Use the prebuilt binary to avoid Docker Hub availability/rate limits.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2
      - name: Check advisories, dependency bans, and sources
        run: cargo deny --locked --all-features check advisories bans sources
