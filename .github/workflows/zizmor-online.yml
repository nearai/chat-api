name: GitHub Actions online security

on:
  schedule:
    - cron: '27 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-online-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zizmor-online:
    # Only trusted default-branch code receives the read-only GitHub token.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor@1.32.0
          fallback: none
      - name: Scan with GitHub advisory and reference data
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --strict-collection --collect=workflows,actions,dependabot --format=github .
