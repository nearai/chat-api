name: Claude Code

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] Explicit write-permission check precedes checkout and Claude.
    types: [created]  # Listen for @claude in PR comments (non-review tasks)
  pull_request_review_comment:
    types: [created]  # Listen for @claude in inline code comments

jobs:
  claude:
    # Run if: @claude in PR comment (WITHOUT review keywords) OR @claude in inline comment
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude') &&
       !contains(github.event.comment.body, '@claude review') &&
       !contains(github.event.comment.body, '@claude code review')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Require repository write permission
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo,
              username: context.actor
            });
            if (!['admin', 'write', 'maintain'].includes(access.permission)) {
              throw new Error('Code review requires repository write permission.');
            }

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read
